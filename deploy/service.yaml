# How this app runs on the platform. The only deployment file the team writes.
# The platform chart (github.com/vengomatto/case-interview, platform/charts/app)
# renders namespace, quota, network policies, deployments, services, ingress,
# database and smoke test from it. No Kubernetes knowledge needed.
#
# `tag` is the commit SHA of the image CI built and pushed to GHCR. CI rewrites it in a
# deploy PR; never edit it by hand. `unreleased` means no image has been proposed yet.
name: testkube-sample
host: testkube-sample.localhost

components:
  api:
    image: ghcr.io/vengomatto/testkube-samples-api
    tag: 8ec38c689cadc233beda0ec52b141e9546a8b791
    port: 8080
    path: /api            # served at http://<host>/api/*, prefix stripped before the app
    health: /hello
    env:
      DB_HOST: db
      DB_PORT: "5432"
  web:
    image: ghcr.io/vengomatto/testkube-samples-web
    tag: 8ec38c689cadc233beda0ec52b141e9546a8b791
    port: 4173
    path: /
    health: /

database:
  enabled: true

smoke:
  - {component: api, path: /hello-pg, contains: "hello world from postgres"}
